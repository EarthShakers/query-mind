<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>霓虹坦克大战</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            margin: 20px;
        }

        #gameCanvas {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 
                0 0 50px rgba(0, 255, 255, 0.3),
                0 0 100px rgba(255, 0, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 20px;
        }

        .score, .lives, .level {
            font-size: 24px;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .controls {
            margin-top: 20px;
            text-align: center;
            opacity: 0.7;
        }

        .game-over, .level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: none;
        }

        .game-over h2 {
            color: #ff4757;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff4757;
        }

        .level-complete h2 {
            color: #00ff88;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff88;
        }

        .game-over button, .level-complete button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .level-complete button {
            background: linear-gradient(45deg, #00ff88, #00ccff);
        }

        .game-over button:hover, .level-complete button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .powerup-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="stats">
        <div class="score">得分: <span id="score">0</span></div>
        <div class="lives">生命: <span id="lives">3</span></div>
        <div class="level">关卡: <span id="level">1</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="powerup-indicator" id="powerupIndicator" style="display: none;">
            能量提升激活中!
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>游戏结束!</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">重新开始</button>
        </div>

        <div class="level-complete" id="levelComplete">
            <h2>关卡完成!</h2>
            <p>得分: <span id="levelScore">0</span></p>
            <button onclick="nextLevel()">下一关</button>
        </div>
    </div>

    <div class="controls">
        <p>WASD 移动坦克 | 空格键射击 | R 重新装弹</p>
        <p>P 暂停游戏 | 收集能量提升获得特殊能力</p>
    </div>

    <script>
        // 游戏配置
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        
        // 颜色配置
        const COLORS = {
            background: 'rgba(0, 0, 0, 0.3)',
            playerTank: '#00ff88',
            enemyTank: '#ff4757',
            bullet: '#00ccff',
            wall: '#6a89cc',
            powerup: '#ffd93d',
            explosion: '#ff6b6b',
            text: '#ffffff'
        };

        // 游戏状态
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let lastRenderTime = 0;
        let powerupActive = false;
        let powerupTimer = 0;

        // 玩家坦克
        let player = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT - 100,
            width: 40,
            height: 40,
            speed: 5,
            rotation: 0,
            bullets: [],
            reloadTime: 0,
            canShoot: true
        };

        // 敌人坦克
        let enemies = [];

        // 墙壁
        let walls = [];

        // 能量提升
        let powerups = [];

        // 爆炸效果
        let explosions = [];

        // 特效粒子
        let particles = [];

        // 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 更新分数显示
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // 更新生命显示
        function updateLives() {
            document.getElementById('lives').textContent = lives;
        }

        // 更新关卡显示
        function updateLevel() {
            document.getElementById('level').textContent = level;
        }

        // 创建爆炸效果
        function createExplosion(x, y, size, color) {
            explosions.push({
                x, y, size,
                currentSize: 0,
                maxSize: size,
                color: color || COLORS.explosion,
                life: 30
            });

            // 创建爆炸粒子
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x, y,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    color: color || COLORS.explosion,
                    life: 50
                });
            }
        }

        // 创建移动粒子轨迹
        function createTrailParticles(x, y, color) {
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    color: color,
                    life: 30
                });
            }
        }

        // 更新粒子
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].speedX;
                particles[i].y += particles[i].speedY;
                particles[i].life--;
                
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // 更新爆炸效果
        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].currentSize += 2;
                explosions[i].life--;
                
                if (explosions[i].life <= 0) {
                    explosions.splice(i, 1);
                }
            }
        }

        // 绘制粒子
        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life / 50;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // 绘制爆炸效果
        function drawExplosions() {
            explosions.forEach(explosion => {
                const alpha = explosion.life / 30;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = explosion.color;
                
                // 绘制圆形爆炸
                ctx.beginPath();
                ctx.arc(explosion.x, explosion.y, explosion.currentSize, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制爆炸光芒
                ctx.globalAlpha = alpha * 0.5;
                ctx.beginPath();
                ctx.arc(explosion.x, explosion.y, explosion.currentSize * 1.5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // 生成关卡
        function generateLevel() {
            walls = [];
            enemies = [];
            powerups = [];
            
            // 创建边界墙
            for (let i = 0; i < 20; i++) {
                // 上边界
                walls.push({ x: i * 40, y: 0, width: 40, height: 40 });
                // 下边界
                walls.push({ x: i * 40, y: GAME_HEIGHT - 40, width: 40, height: 40 });
                // 左边界
                if (i > 0 && i < 15) {
                    walls.push({ x: 0, y: i * 40, width: 40, height: 40 });
                }
                // 右边界
                if (i > 0 && i < 15) {
                    walls.push({ x: GAME_WIDTH - 40, y: i * 40, width: 40, height: 40 });
                }
            }

            // 创建随机障碍物
            for (let i = 0; i < 10 + level * 2; i++) {
                let wall;
                do {
                    wall = {
                        x: Math.floor(Math.random() * 19) * 40 + 40,
                        y: Math.floor(Math.random() * 13) * 40 + 40,
                        width: 40,
                        height: 40
                    };
                } while (
                    // 避免生成在玩家附近
                    Math.abs(wall.x - player.x) < 120 && 
                    Math.abs(wall.y - player.y) < 120
                );
                walls.push(wall);
            }

            // 生成敌人
            for (let i = 0; i < 3 + level; i++) {
                let enemy;
                do {
                    enemy = {
                        x: Math.random() * (GAME_WIDTH - 100) + 50,
                        y: Math.random() * 200 + 50,
                        width: 40,
                        height: 40,
                        speed: 2 + level * 0.5,
                        rotation: Math.PI,
                        bullets: [],
                        shootTimer: 0,
                        health: 1
                    };
                } while (
                    // 避免生成在墙上或玩家附近
                    isCollidingWithWalls(enemy) ||
                    Math.abs(enemy.x - player.x) < 200
                );
                enemies.push(enemy);
            }

            // 生成能量提升
            if (Math.random() < 0.5) {
                powerups.push({
                    x: Math.random() * (GAME_WIDTH - 60) + 30,
                    y: Math.random() * (GAME_HEIGHT - 60) + 30,
                    width: 30,
                    height: 30,
                    type: Math.random() < 0.5 ? 'speed' : 'power',
                    life: 600 // 10秒
                });
            }
        }

        // 碰撞检测
        function isColliding(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        // 与墙壁碰撞检测
        function isCollidingWithWalls(obj) {
            return walls.some(wall => isColliding(obj, wall));
        }

        // 玩家射击
        function playerShoot() {
            if (!player.canShoot) return;
            
            const bullet = {
                x: player.x + player.width / 2,
                y: player.y + player.height / 2,
                width: 8,
                height: 8,
                speed: 10,
                rotation: player.rotation,
                damage: powerupActive ? 2 : 1,
                isPlayer: true
            };
            
            player.bullets.push(bullet);
            player.canShoot = false;
            player.reloadTime = 20; // 重装时间
            
            createTrailParticles(bullet.x, bullet.y, COLORS.bullet);
        }

        // 敌人射击
        function enemyShoot(enemy) {
            if (enemy.shootTimer <= 0) {
                const bullet = {
                    x: enemy.x + enemy.width / 2,
                    y: enemy.y + enemy.height / 2,
                    width: 8,
                    height: 8,
                    speed: 7,
                    rotation: enemy.rotation,
                    damage: 1,
                    isPlayer: false
                };
                
                enemy.bullets.push(bullet);
                enemy.shootTimer = 60 + Math.random() * 60;
                
                createTrailParticles(bullet.x, bullet.y, COLORS.explosion);
            }
        }

        // 更新子弹
        function updateBullets() {
            // 玩家子弹
            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const bullet = player.bullets[i];
                bullet.x += Math.cos(bullet.rotation) * bullet.speed;
                bullet.y += Math.sin(bullet.rotation) * bullet.speed;
                
                // 边界检查
                if (bullet.x < 0 || bullet.x > GAME_WIDTH || 
                    bullet.y < 0 || bullet.y > GAME_HEIGHT) {
                    player.bullets.splice(i, 1);
                    continue;
                }
                
                // 墙壁碰撞
                if (walls.some(wall => isColliding(bullet, wall))) {
                    createExplosion(bullet.x, bullet.y, 15, COLORS.wall);
                    player.bullets.splice(i, 1);
                    continue;
                }
                
                // 敌人碰撞
                let hitEnemy = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (isColliding(bullet, enemies[j])) {
                        enemies[j].health -= bullet.damage;
                        if (enemies[j].health <= 0) {
                            createExplosion(enemies[j].x + enemies[j].width/2, 
                                          enemies[j].y + enemies[j].height/2, 
                                          30, COLORS.enemyTank);
                            score += 100 * level;
                            updateScore();
                            enemies.splice(j, 1);
                        } else {
                            createExplosion(bullet.x, bullet.y, 15, COLORS.enemyTank);
                        }
                        player.bullets.splice(i, 1);
                        hitEnemy = true;
                        break;
                    }
                }
                if (hitEnemy) continue;
                
                // 创建子弹轨迹
                if (Math.random() < 0.3) {
                    createTrailParticles(bullet.x, bullet.y, COLORS.bullet);
                }
            }
            
            // 敌人子弹
            for (let i = 0; i < enemies.length; i++) {
                for (let j = enemies[i].bullets.length - 1; j >= 0; j--) {
                    const bullet = enemies[i].bullets[j];
                    bullet.x += Math.cos(bullet.rotation) * bullet.speed;
                    bullet.y += Math.sin(bullet.rotation) * bullet.speed;
                    
                    // 边界检查
                    if (bullet.x < 0 || bullet.x > GAME_WIDTH || 
                        bullet.y < 0 || bullet.y > GAME_HEIGHT) {
                        enemies[i].bullets.splice(j, 1);
                        continue;
                    }
                    
                    // 墙壁碰撞
                    if (walls.some(wall => isColliding(bullet, wall))) {
                        createExplosion(bullet.x, bullet.y, 15, COLORS.wall);
                        enemies[i].bullets.splice(j, 1);
                        continue;
                    }
                    
                    // 玩家碰撞
                    if (isColliding(bullet, player)) {
                        createExplosion(bullet.x, bullet.y, 25, COLORS.explosion);
                        enemies[i].bullets.splice(j, 1);
                        lives--;
                        updateLives();
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                        continue;
                    }
                    
                    // 创建子弹轨迹
                    if (Math.random() < 0.3) {
                        createTrailParticles(bullet.x, bullet.y, COLORS.explosion);
                    }
                }
            }
        }

        // 更新能量提升
        function updatePowerups() {
            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].life--;
                
                if (powerups[i].life <= 0) {
                    powerups.splice(i, 1);
                    continue;
                }
                
                if (isColliding(player, powerups[i])) {
                    activatePowerup(powerups[i].type);
                    powerups.splice(i, 1);
                }
            }
            
            // 更新能量提升计时器
            if (powerupActive) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    deactivatePowerup();
                }
            }
        }

        // 激活能量提升
        function activatePowerup(type) {
            powerupActive = true;
            powerupTimer = 300; // 5秒
            
            document.getElementById('powerupIndicator').style.display = 'block';
            
            if (type === 'speed') {
                player.speed = 8;
                document.getElementById('powerupIndicator').textContent = '速度提升激活中!';
            } else {
                player.speed = 5;
                document.getElementById('powerupIndicator').textContent = '火力提升激活中!';
            }
            
            createExplosion(player.x, player.y, 40, COLORS.powerup);
        }

        // 取消能量提升
        function deactivatePowerup() {
            powerupActive = false;
            player.speed = 5;
            document.getElementById('powerupIndicator').style.display = 'none';
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // 关卡完成
        function levelComplete() {
            gameRunning = false;
            document.getElementById('levelScore').textContent = score;
            document.getElementById('levelComplete').style.display = 'block';
        }

        // 重新开始游戏
        function restartGame() {
            score = 0;
            lives = 3;
            level = 1;
            
            player.x = GAME_WIDTH / 2;
            player.y = GAME_HEIGHT - 100;
            player.bullets = [];
            player.canShoot = true;
            
            updateScore();
            updateLives();
            updateLevel();
            
            generateLevel();
            deactivatePowerup();
            
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('levelComplete').style.display = 'none';
            
            gameRunning = true;
            gamePaused = false;
            lastRenderTime = 0;
            
            requestAnimationFrame(gameLoop);
        }

        // 下一关
        function nextLevel() {
            level++;
            updateLevel();
            
            player.x = GAME_WIDTH / 2;
            player.y = GAME_HEIGHT - 100;
            player.bullets = [];
            player.canShoot = true;
            
            generateLevel();
            deactivatePowerup();
            
            document.getElementById('levelComplete').style.display = 'none';
            
            gameRunning = true;
            gamePaused = false;
            lastRenderTime = 0;
            
            requestAnimationFrame(gameLoop);
        }

        // 绘制坦克
        function drawTank(x, y, rotation, color, isPlayer = false) {
            ctx.save();
            ctx.translate(x + 20, y + 20);
            ctx.rotate(rotation);
            
            // 坦克主体
            ctx.fillStyle = color;
            ctx.fillRect(-18, -18, 36, 36);
            
            // 坦克履带
            ctx.fillStyle = '#333';
            ctx.fillRect(-20, -22, 40, 4);
            ctx.fillRect(-20, 18, 40, 4);
            
            // 坦克炮管
            ctx.fillStyle = '#666';
            ctx.fillRect(0, -4, 25, 8);
            
            // 玩家坦克的特殊标记
            if (isPlayer) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(-8, -8, 16, 16);
            }
            
            ctx.restore();
        }

        // 绘制墙壁
        function drawWalls() {
            walls.forEach(wall => {
                ctx.fillStyle = COLORS.wall;
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
                
                // 墙壁纹理
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.strokeRect(wall.x + 5, wall.y + 5, wall.width - 10, wall.height - 10);
            });
        }

        // 绘制子弹
        function drawBullets() {
            // 玩家子弹
            player.bullets.forEach(bullet => {
                ctx.fillStyle = COLORS.bullet;
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // 子弹光芒
                ctx.shadowColor = COLORS.bullet;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            // 敌人子弹
            enemies.forEach(enemy => {
                enemy.bullets.forEach(bullet => {
                    ctx.fillStyle = COLORS.explosion;
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 子弹光芒
                    ctx.shadowColor = COLORS.explosion;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            });
        }

        // 绘制能量提升
        function drawPowerups() {
            powerups.forEach(powerup => {
                const pulse = Math.sin(Date.now() / 200) * 5 + 15;
                
                ctx.fillStyle = COLORS.powerup;
                ctx.beginPath();
                ctx.arc(powerup.x + 15, powerup.y + 15, pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // 光芒效果
                ctx.shadowColor = COLORS.powerup;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // 图标
                ctx.fillStyle = '#000';
                if (powerup.type === 'speed') {
                    // 闪电图标
                    ctx.beginPath();
                    ctx.moveTo(powerup.x + 8, powerup.y + 10);
                    ctx.lineTo(powerup.x + 15, powerup.y + 10);
                    ctx.lineTo(powerup.x + 10, powerup.y + 20);
                    ctx.lineTo(powerup.x + 17, powerup.y + 20);
                    ctx.lineTo(powerup.x + 12, powerup.y + 30);
                    ctx.fill();
                } else {
                    // 火焰图标
                    ctx.beginPath();
                    ctx.arc(powerup.x + 15, powerup.y + 18, 6, 0, Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(powerup.x + 10, powerup.y + 15, 4, Math.PI, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(powerup.x + 20, powerup.y + 15, 4, Math.PI, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // 游戏主循环
        function gameLoop(currentTime) {
            if (!gameRunning) return;
            
            requestAnimationFrame(gameLoop);
            
            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < 1 / 60 || gamePaused) return;
            
            lastRenderTime = currentTime;
            
            update();
            draw();
        }

        // 更新游戏状态
        function update() {
            // 更新重装时间
            if (!player.canShoot) {
                player.reloadTime--;
                if (player.reloadTime <= 0) {
                    player.canShoot = true;
                }
            }
            
            // 更新敌人射击计时器
            enemies.forEach(enemy => {
                enemy.shootTimer--;
                if (enemy.shootTimer <= 0) {
                    enemyShoot(enemy);
                }
                
                // 简单AI：朝玩家移动
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 200) {
                    enemy.rotation = Math.atan2(dy, dx);
                    enemy.x += Math.cos(enemy.rotation) * enemy.speed;
                    enemy.y += Math.sin(enemy.rotation) * enemy.speed;
                }
                
                // 避免与墙壁碰撞
                if (isCollidingWithWalls(enemy)) {
                    enemy.rotation += Math.PI / 2;
                }
            });
            
            updateBullets();
            updateParticles();
            updateExplosions();
            updatePowerups();
            
            // 检查关卡完成
            if (enemies.length === 0) {
                levelComplete();
            }
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            drawWalls();
            drawPowerups();
            drawParticles();
            drawExplosions();
            drawBullets();
            
            // 绘制玩家坦克
            drawTank(player.x, player.y, player.rotation, COLORS.playerTank, true);
            
            // 绘制敌人坦克
            enemies.forEach(enemy => {
                drawTank(enemy.x, enemy.y, enemy.rotation, COLORS.enemyTank);
            });
        }

        // 初始化游戏
        function init() {
            updateScore();
            updateLives();
            updateLevel();
            generateLevel();
            
            // 首帧绘制
            draw();
            
            // 监听键盘输入
            document.addEventListener('keydown', (e) => {
                if (!gameRunning && (e.key === 'Enter' || e.key === ' ')) {
                    restartGame();
                    return;
                }
                
                if (e.key === 'p' || e.key === 'P') {
                    gamePaused = !gamePaused;
                    if (!gamePaused) {
                        lastRenderTime = performance.now();
                        requestAnimationFrame(gameLoop);
                    }
                    return;
                }
                
                if (e.key === 'r' || e.key === 'R') {
                    player.canShoot = true;
                    player.reloadTime = 0;
                    return;
                }
                
                if (e.key === ' ') {
                    playerShoot();
                    return;
                }
                
                switch (e.key.toLowerCase()) {
                    case 'w':
                        player.rotation = -Math.PI / 2;
                        player.y -= player.speed;
                        createTrailParticles(player.x + 20, player.y + 40, COLORS.playerTank);
                        break;
                    case 's':
                        player.rotation = Math.PI / 2;
                        player.y += player.speed;
                        createTrailParticles(player.x + 20, player.y, COLORS.playerTank);
                        break;
                    case 'a':
                        player.rotation = Math.PI;
                        player.x -= player.speed;
                        createTrailParticles(player.x + 40, player.y + 20, COLORS.playerTank);
                        break;
                    case 'd':
                        player.rotation = 0;
                        player.x += player.speed;
                        createTrailParticles(player.x, player.y + 20, COLORS.playerTank);
                        break;
                }
                
                // 边界检查
                player.x = Math.max(40, Math.min(GAME_WIDTH - 40, player.x));
                player.y = Math.max(40, Math.min(GAME_HEIGHT - 40, player.y));
                
                // 避免与墙壁碰撞
                if (isCollidingWithWalls(player)) {
                    player.x = Math.max(40, Math.min(GAME_WIDTH - 40, player.x));
                    player.y = Math.max(40, Math.min(GAME_HEIGHT - 40, player.y));
                }
            });
        }

        // 启动游戏
        init();
    </script>
</body>
</html>
