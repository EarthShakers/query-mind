<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 人机对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        
        h1 {
            color: #e8e8e8;
            margin-bottom: 15px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .game-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .current-player {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            color: #e8e8e8;
        }
        
        .player-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        
        .player-indicator.black {
            background: radial-gradient(circle at 30% 30%, #555, #000);
        }
        
        .player-indicator.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
            border: 1px solid #999;
        }
        
        .ai-thinking {
            color: #f39c12;
            font-size: 14px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .game-container {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            cursor: pointer;
        }
        
        #gameCanvas.disabled {
            cursor: not-allowed;
        }
        
        .btn-restart {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        
        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
        }
        
        .btn-restart:active {
            transform: translateY(0);
        }
        
        /* 胜利弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            padding: 40px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .modal h2 {
            color: #f1c40f;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .modal p {
            color: #ecf0f1;
            font-size: 18px;
            margin-bottom: 25px;
        }
        
        .winner-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .winner-stone {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        
        .modal button {
            padding: 12px 35px;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        
        .modal button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
        }
        
        .score-board {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            color: #e8e8e8;
        }
        
        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .score-item span {
            font-size: 16px;
        }
        
        .score-item .count {
            font-size: 20px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <h1>五子棋 - 人机对战</h1>
    
    <div class="score-board">
        <div class="score-item">
            <div class="player-indicator black"></div>
            <span>玩家:</span>
            <span class="count" id="playerWins">0</span>
        </div>
        <div class="score-item">
            <div class="player-indicator white"></div>
            <span>AI:</span>
            <span class="count" id="aiWins">0</span>
        </div>
    </div>
    
    <div class="game-info">
        <div class="current-player">
            <span>当前：</span>
            <div class="player-indicator black" id="playerIndicator"></div>
            <span id="playerText">玩家思考中</span>
        </div>
        <span class="ai-thinking" id="aiThinking" style="display: none;">AI 思考中...</span>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <button class="btn-restart" onclick="restartGame()">重新开始</button>
    
    <!-- 胜利弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">🎉 游戏结束</h2>
            <div class="winner-display">
                <div class="winner-stone" id="winnerStone"></div>
                <p id="winnerText"></p>
            </div>
            <button onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const BOARD_SIZE = 15;
        const CELL_SIZE = 36;
        const PADDING = 25;
        const STONE_RADIUS = 15;
        const CANVAS_SIZE = CELL_SIZE * (BOARD_SIZE - 1) + PADDING * 2;
        
        // 玩家标识
        const PLAYER = 1;  // 黑棋 - 玩家
        const AI = 2;      // 白棋 - AI
        
        // 游戏状态
        let board = [];
        let currentPlayer = PLAYER;
        let gameOver = false;
        let lastMove = null;
        let isAIThinking = false;
        let playerWins = 0;
        let aiWins = 0;
        
        // 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        
        // 初始化棋盘数组
        function initBoard() {
            board = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                board[i] = [];
                for (let j = 0; j < BOARD_SIZE; j++) {
                    board[i][j] = 0;
                }
            }
            currentPlayer = PLAYER;
            gameOver = false;
            lastMove = null;
            isAIThinking = false;
            updatePlayerDisplay();
            canvas.classList.remove('disabled');
        }
        
        // 更新玩家显示
        function updatePlayerDisplay() {
            const indicator = document.getElementById('playerIndicator');
            const text = document.getElementById('playerText');
            const aiThinking = document.getElementById('aiThinking');
            
            indicator.className = 'player-indicator ' + (currentPlayer === PLAYER ? 'black' : 'white');
            
            if (gameOver) {
                text.textContent = '游戏结束';
                aiThinking.style.display = 'none';
            } else if (currentPlayer === PLAYER) {
                text.textContent = '玩家思考中';
                aiThinking.style.display = 'none';
            } else {
                text.textContent = 'AI思考中';
                aiThinking.style.display = 'inline';
            }
        }
        
        // 更新比分
        function updateScore() {
            document.getElementById('playerWins').textContent = playerWins;
            document.getElementById('aiWins').textContent = aiWins;
        }
        
        // 绘制棋盘
        function drawBoard() {
            // 棋盘背景
            ctx.fillStyle = '#dcb35c';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            // 绘制网格线
            ctx.strokeStyle = '#8b6914';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                // 横线
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE);
                ctx.stroke();
                
                // 竖线
                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();
            }
            
            // 绘制星位
            const starPoints = [
                [3, 3], [3, 11], [11, 3], [11, 11],
                [7, 7],
                [3, 7], [7, 3], [7, 11], [11, 7]
            ];
            
            ctx.fillStyle = '#8b6914';
            starPoints.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // 绘制棋子
        function drawStone(x, y, player, isLast = false) {
            const px = PADDING + x * CELL_SIZE;
            const py = PADDING + y * CELL_SIZE;
            
            ctx.save();
            
            // 棋子阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            
            // 绘制棋子
            if (player === PLAYER) {
                // 黑棋
                const gradient = ctx.createRadialGradient(px - 5, py - 5, 0, px, py, STONE_RADIUS);
                gradient.addColorStop(0, '#666');
                gradient.addColorStop(1, '#000');
                ctx.fillStyle = gradient;
            } else {
                // 白棋
                const gradient = ctx.createRadialGradient(px - 5, py - 5, 0, px, py, STONE_RADIUS);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(1, '#ccc');
                ctx.fillStyle = gradient;
            }
            
            ctx.beginPath();
            ctx.arc(px, py, STONE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // 最后一步标记
            if (isLast) {
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, STONE_RADIUS - 3, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        // 绘制所有棋子
        function drawAllStones() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] !== 0) {
                        const isLast = lastMove && lastMove.x === i && lastMove.y === j;
                        drawStone(i, j, board[i][j], isLast);
                    }
                }
            }
        }
        
        // 渲染游戏
        function render() {
            drawBoard();
            drawAllStones();
        }
        
        // 获取点击位置对应的棋盘坐标
        function getBoardPosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            const boardX = Math.round((x - PADDING) / CELL_SIZE);
            const boardY = Math.round((y - PADDING) / CELL_SIZE);
            
            if (boardX >= 0 && boardX < BOARD_SIZE && boardY >= 0 && boardY < BOARD_SIZE) {
                const px = PADDING + boardX * CELL_SIZE;
                const py = PADDING + boardY * CELL_SIZE;
                const distance = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                
                if (distance <= STONE_RADIUS + 5) {
                    return { x: boardX, y: boardY };
                }
            }
            return null;
        }
        
        // 玩家落子
        function placeStone(x, y) {
            if (gameOver || isAIThinking) return;
            if (currentPlayer !== PLAYER) return;
            if (board[x][y] !== 0) return;
            
            board[x][y] = PLAYER;
            lastMove = { x, y };
            render();
            
            // 检查胜负
            if (checkWin(x, y, PLAYER)) {
                gameOver = true;
                playerWins++;
                updateScore();
                updatePlayerDisplay();
                showWinModal(PLAYER);
                return;
            }
            
            // 检查平局
            if (checkDraw()) {
                gameOver = true;
                updatePlayerDisplay();
                showDrawModal();
                return;
            }
            
            // 切换到AI
            currentPlayer = AI;
            updatePlayerDisplay();
            canvas.classList.add('disabled');
            
            // AI思考后落子
            setTimeout(aiMove, 500);
        }
        
        // AI落子
        function aiMove() {
            if (gameOver) return;
            
            isAIThinking = true;
            
            const bestMove = findBestMove();
            
            if (bestMove) {
                board[bestMove.x][bestMove.y] = AI;
                lastMove = { x: bestMove.x, y: bestMove.y };
                render();
                
                // 检查胜负
                if (checkWin(bestMove.x, bestMove.y, AI)) {
                    gameOver = true;
                    aiWins++;
                    updateScore();
                    updatePlayerDisplay();
                    showWinModal(AI);
                    isAIThinking = false;
                    return;
                }
                
                // 检查平局
                if (checkDraw()) {
                    gameOver = true;
                    updatePlayerDisplay();
                    showDrawModal();
                    isAIThinking = false;
                    return;
                }
            }
            
            // 切换到玩家
            currentPlayer = PLAYER;
            isAIThinking = false;
            updatePlayerDisplay();
            canvas.classList.remove('disabled');
        }
        
        // AI寻找最佳落子位置
        function findBestMove() {
            let bestScore = -Infinity;
            let bestMoves = [];
            
            // 如果是第一步，下在中心附近
            let hasStone = false;
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] !== 0) {
                        hasStone = true;
                        break;
                    }
                }
                if (hasStone) break;
            }
            
            if (!hasStone) {
                return { x: 7, y: 7 };
            }
            
            // 评估每个空位
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0) {
                        // 只考虑周围有棋子的位置
                        if (!hasNeighbor(i, j)) continue;
                        
                        const score = evaluatePosition(i, j);
                        
                        if (score > bestScore) {
                            bestScore = score;
                            bestMoves = [{ x: i, y: j }];
                        } else if (score === bestScore) {
                            bestMoves.push({ x: i, y: j });
                        }
                    }
                }
            }
            
            // 随机选择一个最佳位置
            if (bestMoves.length > 0) {
                return bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }
            
            // 如果没有找到，返回第一个空位
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0) {
                        return { x: i, y: j };
                    }
                }
            }
            
            return null;
        }
        
        // 检查位置周围是否有棋子
        function hasNeighbor(x, y) {
            for (let dx = -2; dx <= 2; dx++) {
                for (let dy = -2; dy <= 2; dy++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                        if (board[nx][ny] !== 0) return true;
                    }
                }
            }
            return false;
        }
        
        // 评估位置分数
        function evaluatePosition(x, y) {
            let score = 0;
            
            // AI进攻分数
            board[x][y] = AI;
            score += evaluatePoint(x, y, AI) * 1.1; // 进攻略优先
            board[x][y] = 0;
            
            // 防守分数（阻止玩家）
            board[x][y] = PLAYER;
            score += evaluatePoint(x, y, PLAYER);
            board[x][y] = 0;
            
            // 中心位置加分
            const centerDist = Math.abs(x - 7) + Math.abs(y - 7);
            score += (14 - centerDist) * 0.1;
            
            return score;
        }
        
        // 评估某点对某玩家的价值
        function evaluatePoint(x, y, player) {
            let score = 0;
            
            const directions = [
                [1, 0],   // 横向
                [0, 1],   // 纵向
                [1, 1],   // 右下斜
                [1, -1]   // 右上斜
            ];
            
            for (const [dx, dy] of directions) {
                const lineScore = evaluateLine(x, y, dx, dy, player);
                score += lineScore;
            }
            
            return score;
        }
        
        // 评估一条线上的棋型
        function evaluateLine(x, y, dx, dy, player) {
            let count = 1;
            let block = 0;
            let empty = 0;
            
            // 正向计数
            let i = 1;
            while (true) {
                const nx = x + dx * i;
                const ny = y + dy * i;
                if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
                    block++;
                    break;
                }
                if (board[nx][ny] === player) {
                    count++;
                    i++;
                } else if (board[nx][ny] === 0) {
                    empty++;
                    break;
                } else {
                    block++;
                    break;
                }
            }
            
            // 反向计数
            i = 1;
            while (true) {
                const nx = x - dx * i;
                const ny = y - dy * i;
                if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
                    block++;
                    break;
                }
                if (board[nx][ny] === player) {
                    count++;
                    i++;
                } else if (board[nx][ny] === 0) {
                    empty++;
                    break;
                } else {
                    block++;
                    break;
                }
            }
            
            // 根据棋型评分
            return getPatternScore(count, block, empty);
        }
        
        // 棋型评分
        function getPatternScore(count, block, empty) {
            if (count >= 5) return 100000; // 五连
            
            if (block === 2) return 0; // 两头都被堵
            
            switch (count) {
                case 4:
                    return block === 0 ? 10000 : 1000; // 活四或冲四
                case 3:
                    return block === 0 ? 1000 : 100; // 活三或眠三
                case 2:
                    return block === 0 ? 100 : 10; // 活二或眠二
                case 1:
                    return block === 0 ? 10 : 1; // 活一
                default:
                    return 0;
            }
        }
        
        // 检查胜负
        function checkWin(x, y, player) {
            const directions = [
                [1, 0],   // 横向
                [0, 1],   // 纵向
                [1, 1],   // 右下斜
                [1, -1]   // 右上斜
            ];
            
            for (const [dx, dy] of directions) {
                let count = 1;
                
                // 正向检查
                let nx = x + dx;
                let ny = y + dy;
                while (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
                    count++;
                    nx += dx;
                    ny += dy;
                }
                
                // 反向检查
                nx = x - dx;
                ny = y - dy;
                while (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
                    count++;
                    nx -= dx;
                    ny -= dy;
                }
                
                if (count >= 5) return true;
            }
            
            return false;
        }
        
        // 检查平局
        function checkDraw() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0) return false;
                }
            }
            return true;
        }
        
        // 显示胜利弹窗
        function showWinModal(winner) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const stone = document.getElementById('winnerStone');
            const text = document.getElementById('winnerText');
            
            if (winner === PLAYER) {
                title.textContent = '🎉 恭喜获胜！';
                stone.className = 'winner-stone black';
                stone.style.background = 'radial-gradient(circle at 30% 30%, #555, #000)';
                stone.style.border = 'none';
                text.textContent = '玩家战胜了AI！';
            } else {
                title.textContent = '😔 很遗憾';
                stone.className = 'winner-stone white';
                stone.style.background = 'radial-gradient(circle at 30% 30%, #fff, #ccc)';
                stone.style.border = '1px solid #999';
                text.textContent = 'AI获胜，再接再厉！';
            }
            
            overlay.classList.add('show');
        }
        
        // 显示平局弹窗
        function showDrawModal() {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const stone = document.getElementById('winnerStone');
            const text = document.getElementById('winnerText');
            
            title.textContent = '🤝 平局';
            stone.style.display = 'none';
            text.textContent = '棋逢对手，势均力敌！';
            overlay.classList.add('show');
        }
        
        // 隐藏弹窗
        function hideModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('winnerStone').style.display = 'block';
        }
        
        // 重新开始游戏
        function restartGame() {
            hideModal();
            initBoard();
            render();
        }
        
        // 点击事件
        canvas.addEventListener('click', (e) => {
            if (gameOver || isAIThinking || currentPlayer !== PLAYER) return;
            
            const pos = getBoardPosition(e.clientX, e.clientY);
            if (pos) {
                placeStone(pos.x, pos.y);
            }
        });
        
        // 鼠标移动时显示预览
        canvas.addEventListener('mousemove', (e) => {
            if (gameOver || isAIThinking || currentPlayer !== PLAYER) return;
            
            const pos = getBoardPosition(e.clientX, e.clientY);
            
            render();
            
            if (pos && board[pos.x][pos.y] === 0) {
                const px = PADDING + pos.x * CELL_SIZE;
                const py = PADDING + pos.y * CELL_SIZE;
                
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.arc(px, py, STONE_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        });
        
        // 鼠标离开时重绘
        canvas.addEventListener('mouseleave', () => {
            render();
        });
        
        // 初始化游戏
        initBoard();
        render();
    </script>
</body>
</html>
