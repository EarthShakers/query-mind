name: RAG Eval

on:
  schedule:
    # UTC 0:00 / 12:00 = 北京时间 8:00 / 20:00
    - cron: "0 0,12 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: SUPABASE_URL
    timeout-minutes: 30
    outputs:
      eval_exit_code: ${{ steps.eval.outputs.exit_code }}
      eval_failure_reason: ${{ steps.eval.outputs.failure_reason }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL is NOT set"; else echo "SUPABASE_URL is set (length=${#SUPABASE_URL})"; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "SUPABASE_ANON_KEY is NOT set"; else echo "SUPABASE_ANON_KEY is set"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "SUPABASE_SERVICE_ROLE_KEY is NOT set"; else echo "SUPABASE_SERVICE_ROLE_KEY is set"; fi
          if [ -z "$DASHSCOPE_API_KEY" ]; then echo "DASHSCOPE_API_KEY is NOT set"; else echo "DASHSCOPE_API_KEY is set"; fi
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL is NOT set"; else echo "DATABASE_URL is set"; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run RAG E2E Evaluation
        id: eval
        run: |
          set +e
          pnpm eval:cron > eval-run.log 2>&1
          CODE=$?

          {
            echo "exit_code=$CODE"
            echo "failure_reason<<EOF"
            if [ "$CODE" -ne 0 ]; then
              grep -E "PermissionDeniedError|AllocationQuota|Error:|ELIFECYCLE|Process completed with exit code" eval-run.log | tail -n 12 || true
            else
              echo ""
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat eval-run.log
          exit "$CODE"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 成功时钉钉通知（含各指标得分）
      - name: Notify DingTalk (Success)
        if: success()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then echo "Skipping: DINGTALK_WEBHOOK not set"; exit 0; fi
          LATEST=$(ls -t eval/reports/report-*.json 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then exit 0; fi
          F=$(jq -r '.summary.faithfulness // 0' "$LATEST")
          A=$(jq -r '.summary.answer_relevancy // 0' "$LATEST")
          P=$(jq -r '.summary.context_precision // 0' "$LATEST")
          R=$(jq -r '.summary.context_recall // 0' "$LATEST")
          N=$(jq -r '.meta.sampleCount // (.samples | length)' "$LATEST")
          CONTENT="✅ RAG Eval 成功
          faithfulness: $(printf "%.2f" $F)
          answer_relevancy: $(printf "%.2f" $A)
          context_precision: $(printf "%.2f" $P)
          context_recall: $(printf "%.2f" $R)
          样本数: $N
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TIMESTAMP=$(date +%s)000
          if [ -n "$DINGTALK_SECRET" ]; then
            SIGN=$(printf '%s\n%s' "$TIMESTAMP" "$DINGTALK_SECRET" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 -w 0 | sed 's/+/%2B/g;s/\//%2F/g;s/=/%3D/g')
            URL="${DINGTALK_WEBHOOK}&timestamp=${TIMESTAMP}&sign=${SIGN}"
          else
            URL="$DINGTALK_WEBHOOK"
          fi
          curl -sS -X POST -H 'Content-type: application/json' --data "{
            \"msgtype\": \"text\",
            \"text\": {\"content\": $(echo "$CONTENT" | jq -Rs .)}
          }" "$URL"

  # 失败时钉钉通知（需在仓库 Secrets 添加 DINGTALK_WEBHOOK，可选 DINGTALK_SECRET 用于加签）
  notify-failure:
    runs-on: ubuntu-latest
    environment: SUPABASE_URL
    needs: eval
    if: ${{ always() && needs.eval.result != 'success' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Notify DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_FAILURE_REASON: ${{ needs.eval.outputs.eval_failure_reason }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then echo "Skipping: DINGTALK_WEBHOOK not set"; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESULT="${{ needs.eval.result }}"

          JOB_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" || true)

          EVAL_JOB=$(echo "$JOB_JSON" | jq -c '.jobs[]? | select(.name=="eval")' 2>/dev/null || true)
          if [ -z "$EVAL_JOB" ] || [ "$EVAL_JOB" = "null" ]; then
            FAILED_STEPS="(未解析到失败步骤)"
            CONCLUSION="$RESULT"
          else
            FAILED_STEPS=$(echo "$EVAL_JOB" | jq -r '[.steps[]? | select(.conclusion=="failure") | .name] | if length>0 then join(", ") else "(无明确失败步骤，可能超时/取消)" end')
            CONCLUSION=$(echo "$EVAL_JOB" | jq -r '.conclusion // "'"$RESULT"'"')
          fi

          CONTENT=$(printf "⚠️ RAG Eval 失败\n结果: %s\n结论: %s\n失败步骤: %s\n错误摘要:\n%s\n%s" \
            "$RESULT" \
            "$CONCLUSION" \
            "$FAILED_STEPS" \
            "$EVAL_FAILURE_REASON" \
            "$RUN_URL")

          TIMESTAMP=$(date +%s)000
          if [ -n "$DINGTALK_SECRET" ]; then
            SIGN=$(printf '%s\n%s' "$TIMESTAMP" "$DINGTALK_SECRET" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 -w 0 | sed 's/+/%2B/g;s/\//%2F/g;s/=/%3D/g')
            URL="${DINGTALK_WEBHOOK}&timestamp=${TIMESTAMP}&sign=${SIGN}"
          else
            URL="$DINGTALK_WEBHOOK"
          fi
          curl -sS -X POST -H 'Content-type: application/json' --data "{
            \"msgtype\": \"text\",
            \"text\": {\"content\": $(echo "$CONTENT" | jq -Rs .)}
          }" "$URL"
