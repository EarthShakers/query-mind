# 构建并推送到 GitHub Container Registry（免费，无需额外配置）
# 服务器 pull 镜像运行，无需源码

name: Build & Push to GHCR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: ai-sql-demo

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image prefix
        id: vars
        run: echo "prefix=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}:latest
            ${{ steps.vars.outputs.prefix }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
