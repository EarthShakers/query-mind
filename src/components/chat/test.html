<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER AI - Agent Status Monitor</title>
    <style>
      :root {
        --bg-color: #05080a;
        --panel-bg: rgba(15, 23, 42, 0.7);
        --accent-blue: #00d4ff;
        --accent-green: #00ff88;
        --text-main: #e2e8f0;
        --text-dim: #94a3b8;
        --border-glow: rgba(0, 212, 255, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Segoe UI", system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: 300px 1fr 350px;
        gap: 20px;
        padding: 20px;
        background-image: radial-gradient(
            circle at 50% 50%,
            rgba(0, 212, 255, 0.05) 0%,
            transparent 70%
          ),
          linear-gradient(rgba(10, 15, 25, 0.8) 1px, transparent 1px),
          linear-gradient(90deg, rgba(10, 15, 25, 0.8) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
      }

      /* 通用面板样式 */
      .panel {
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .panel-header {
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-blue);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
      }

      /* 左侧：Agent 核心 */
      .agent-profile {
        padding: 30px 20px;
        text-align: center;
      }

      .avatar-container {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        position: relative;
      }

      .avatar-core {
        width: 100%;
        height: 100%;
        background: conic-gradient(
          from 0deg,
          var(--accent-blue),
          var(--accent-green),
          var(--accent-blue)
        );
        border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        animation: morph 8s ease-in-out infinite;
        filter: blur(2px) drop-shadow(0 0 15px var(--accent-blue));
      }

      @keyframes morph {
        0% {
          border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }
        50% {
          border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
          transform: rotate(180deg);
        }
        100% {
          border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
          transform: rotate(360deg);
        }
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(0, 255, 136, 0.1);
        color: var(--accent-green);
        font-size: 0.75rem;
        margin-top: 10px;
        border: 1px solid var(--accent-green);
      }

      /* 中间：思维导图可视化 */
      .mind-map {
        position: relative;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .node {
        position: absolute;
        padding: 12px 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-glow);
        border-radius: 8px;
        font-size: 0.9rem;
        animation: fadeIn 0.5s ease-out forwards;
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
      }

      .node.active {
        border-color: var(--accent-green);
        box-shadow: 0 0 25px rgba(0, 255, 136, 0.2);
      }

      .line {
        position: absolute;
        background: linear-gradient(90deg, var(--accent-blue), transparent);
        height: 1px;
        transform-origin: left;
        animation: grow 1s ease-out;
      }

      /* 右侧：实时输出 */
      .terminal {
        flex-grow: 1;
        padding: 20px;
        font-family: "Fira Code", monospace;
        font-size: 0.85rem;
        overflow-y: auto;
        color: var(--text-dim);
      }

      .log-entry {
        margin-bottom: 10px;
        border-left: 2px solid var(--accent-blue);
        padding-left: 10px;
        animation: slideIn 0.3s ease-out;
      }

      .log-time {
        color: var(--accent-blue);
        font-weight: bold;
        margin-right: 8px;
      }
      .log-msg {
        color: var(--text-main);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes grow {
        from {
          scale: 0 1;
        }
        to {
          scale: 1 1;
        }
      }
    </style>
  </head>
  <body>
    <aside class="panel">
      <div class="panel-header">System Profile <span>v2.1.4</span></div>
      <div class="agent-profile">
        <div class="avatar-container">
          <div class="avatar-core"></div>
        </div>
        <h2>AETHER-1</h2>
        <div class="status-badge">● 正在进行深度推理</div>
        <div style="margin-top: 40px; text-align: left">
          <p
            style="
              color: var(--accent-blue);
              font-size: 0.7rem;
              margin-bottom: 5px;
            "
          >
            当前目标：
          </p>
          <p style="font-size: 0.9rem; line-height: 1.4">
            分析全球半导体供应链趋势并预测 2026 年产能波动。
          </p>
        </div>
      </div>
    </aside>

    <main class="panel" style="border: 1px solid var(--border-glow)">
      <div class="panel-header">Reasoning Graph <span>Dynamic Path</span></div>
      <div class="mind-map" id="mindMap">
        <div class="node active" style="top: 20%; left: 10%">解析原始需求</div>
        <div class="line" style="top: 24%; left: 32%; width: 60px"></div>
        <div class="node" style="top: 20%; left: 40%">检索市场数据</div>
        <div class="node" style="top: 45%; left: 40%">历史周期对比</div>
        <div class="node" style="top: 70%; left: 40%">地缘政治风险评估</div>
      </div>
    </main>

    <section class="panel">
      <div class="panel-header">Execution Stream <span>Live Updates</span></div>
      <div class="terminal" id="terminal">
        <div class="log-entry">
          <span class="log-time">[08:42:01]</span
          ><span class="log-msg">系统初始化完成。</span>
        </div>
        <div class="log-entry">
          <span class="log-time">[08:42:03]</span
          ><span class="log-msg">正在接入 Web 搜索 API...</span>
        </div>
        <div class="log-entry">
          <span class="log-time">[08:42:05]</span
          ><span class="log-msg">已获取 14 份行业研究报告。</span>
        </div>
      </div>
    </section>

    <script>
      // 模拟实时日志动态添加
      const logs = [
        "分析数据点：台积电 2nm 工厂进度...",
        "计算风险权重值：0.84",
        "正在通过 Python 执行线性回归模型...",
        "识别到潜在瓶颈：原材料供应延迟。",
        "正在重新规划推理路径...",
        "生成最终结论摘要...",
      ];

      let logIndex = 0;
      const terminal = document.getElementById("terminal");

      function addLog() {
        if (logIndex < logs.length) {
          const now = new Date();
          const timeStr = `[${now.getHours().toString().padStart(2, "0")}:${now
            .getMinutes()
            .toString()
            .padStart(2, "0")}:${now
            .getSeconds()
            .toString()
            .padStart(2, "0")}]`;

          const div = document.createElement("div");
          div.className = "log-entry";
          div.innerHTML = `<span class="log-time">${timeStr}</span><span class="log-msg">${logs[logIndex]}</span>`;
          terminal.appendChild(div);
          terminal.scrollTop = terminal.scrollHeight;
          logIndex++;
          setTimeout(addLog, Math.random() * 2000 + 1000);
        }
      }

      setTimeout(addLog, 2000);
    </script>
  </body>
</html>
